name: Final KDP Build
on:
  push:
    branches:
      - main
  workflow_dispatch: # ඔබට අවශ්‍ය විටෙක අතින් (Manually) Run කිරීමට

jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build DOCX Book
        run: |
          # මෙහි කිසිදු බාහිර .yaml ගොනුවක් භාවිතා නොවේ. 
          # සියලුම KDP settings මෙහි ඇතුළත් කර ඇත.
          # glossary.md හෝ conclusion.md නැතිනම් ඒවා පහත ලැයිස්තුවෙන් ඉවත් කරන්න.
          
          pandoc README.md chapters/*.md appendices/*.md \
          -f markdown \
          -t docx \
          -o emotional_intelligence_sl.docx \
          --toc \
          --toc-depth=2 \
          -V lang=si-LK \
          --number-sections \
          --verbose

      - name: Upload DOCX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KDP-Ready-DOCX
          path: emotional_intelligence_sl.docx
          
