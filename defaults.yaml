# defaults.yaml
from: markdown
to: pdf
input-files:
  - README.md
  - chapters/".md # ඔබේ පරිච්ඡේද ඇති ෆෝල්ඩරය  
  - appendices/*.md # ඔබේ උපග්‍රන්ථ ඇති ෆෝල්ඩරය
  - glossary.md
  - conclusion.md

output-file: emotional_intelligence_sl.pdf

pdf-engine: xelatex
variables:
  mainfont: "LKLUG"     # GitHub Actions හි ඇති එකම සිංහල ෆොන්ට් එක
  fontsize: 12pt
  geometry:
    - paperwidth=6in
    - paperheight=9in
    - margin=0.75in
  lang: si-LK
