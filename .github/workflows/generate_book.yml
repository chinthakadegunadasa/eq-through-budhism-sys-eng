name: Generate KDP Book
on:
  push:
    branches:
      - main

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4 ලෙස යාවත්කාලීන කරන ලදී

      - name: Install Pandoc and XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic fonts-lklug-sinhala

      - name: Build Book using Defaults
        run: |
          # defaults.yaml ගොනුවේ mainfont: "LKLUG" ලෙස ඇති බව සහතික කරගන්න
          pandoc -d defaults.yaml

      - name: Upload Generated PDF
        uses: actions/upload-artifact@v4 # v4 ලෙස යාවත්කාලීන කරන ලදී
        with:
          name: KDP-Ready-Book
          path: emotional_intelligence_sl.pdf
          retention-days: 5 # දින 5කින් පසු ගොනුව ඉවත් වේ (විකල්ප)
