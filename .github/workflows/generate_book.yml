name: Generate KDP DOCX
on:
  push:
    branches:
      - main

jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build DOCX Book
        run: |
          # defaults.yaml මගින් DOCX ගොනුව ජනනය කරයි
          pandoc -d defaults.yaml

      - name: Upload DOCX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KDP-Ready-DOCX
          path: emotional_intelligence_sl.docx
          
