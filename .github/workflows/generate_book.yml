name: Generate KDP DOCX Final
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build DOCX Book
        run: |
          # මෙහි -d defaults.yaml භාවිතා නොකර කෙලින්ම parameters ලබා දෙයි.
          # එවිට කිසිදු YAML Parsing දෝෂයක් ඇති නොවේ.
          pandoc Forward.md README.md chapters/*.md appendices/*.md \
          -f markdown \
          -t docx \
          -o emotional_intelligence_sl.docx \
          --toc \
          --toc-depth=2 \
          -V lang=si-LK \
          --number-sections \
          --verbose

      - name: Upload DOCX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KDP-Ready-DOCX
          path: emotional_intelligence_sl.docx
          
