name: Generate KDP DOCX
on:
  push:
    branches:
      - main

jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build DOCX Book
        run: |
          # Bash මගින් Wildcards නිවැරදිව Expand කර Pandoc වෙත ලබා දීම
          # glossary.md හෝ conclusion.md තවම නැතිනම් ඒවා මෙම පේළියෙන් ඉවත් කරන්න
          pandoc README.md chapters/*.md appendices/*.md glossary.md conclusion.md \
          -d defaults.yaml \
          --verbose

      - name: Upload DOCX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KDP-Ready-DOCX
          path: emotional_intelligence_sl.docx
  
