name: Generate KDP DOCX
on:
  push:
    branches:
      - main

jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build DOCX Book
        run: |
          # defaults.yaml භාවිතා නොකර කෙලින්ම විධානයන් ලබා දීම
          # මෙය 100% ක් සාර්ථක සහ ආරක්ෂිත ක්‍රමයයි
          pandoc README.md chapters/*.md appendices/*.md glossary.md conclusion.md \
          -f markdown \
          -t docx \
          -o emotional_intelligence_sl.docx \
          --toc \
          --toc-depth=2 \
          -V lang=si-LK \
          --number-sections \
          --verbose

      - name: Upload DOCX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KDP-Ready-DOCX
          path: emotional_intelligence_sl.docx
