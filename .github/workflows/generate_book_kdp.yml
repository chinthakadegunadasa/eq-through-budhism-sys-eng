name: Generate KDP Book
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build Book (DOCX)
        run: |
          # defaults.yaml ගොනුව මත යැපීම සම්පූර්ණයෙන්ම නතර කර, 
          # සියලුම parameters මෙහි ලබා දෙයි.
          
          pandoc Forward.md Author_Forward.md README.md chapters/*.md appendices/*.md \
          -f markdown \
          -t docx \
          -o emotional_intelligence_sl.docx \
          --toc \
          --toc-depth=2 \
          -V lang=si-LK \
          --number-sections \
          --verbose

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: KDP-Output
          path: emotional_intelligence_sl.docx
